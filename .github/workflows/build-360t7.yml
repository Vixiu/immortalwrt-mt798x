name: Build 360T7 (immortalwrt-mt798x)

on:
  workflow_dispatch:
    inputs:
      extra_seed_config:
        description: "Optional extra .config snippets (Kconfig lines), empty = none"
        required: false
        default: ""
      clean_build:
        description: "Clean build directory (slower, but safer if config changed a lot)"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout this repo (workflow repo)
        uses: actions/checkout@v4

      - name: Free disk space (helpful for OpenWrt builds)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-distutils rsync \
            unzip zlib1g-dev file wget ccache ca-certificates
          sudo apt-get clean

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.workflow }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.workflow }}-

      - name: Cache dl directory
        uses: actions/cache@v4
        with:
          path: |
            immortalwrt-mt798x/dl
          key: dl-${{ runner.os }}-${{ github.workflow }}-${{ github.run_id }}
          restore-keys: |
            dl-${{ runner.os }}-${{ github.workflow }}-

      - name: Clone source (hanwckf/immortalwrt-mt798x)
        run: |
          git clone --depth=1 https://github.com/hanwckf/immortalwrt-mt798x.git immortalwrt-mt798x
          cd immortalwrt-mt798x
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Update & install feeds
        working-directory: immortalwrt-mt798x
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare .config for 360T7 (MT7981 AX3000)
        working-directory: immortalwrt-mt798x
        run: |
          cp -f defconfig/mt7981-ax3000.config .config

          # Optionally append extra seed config lines passed from workflow input
          if [ -n "${{ inputs.extra_seed_config }}" ]; then
            echo "${{ inputs.extra_seed_config }}" >> .config
          fi

          make defconfig

      - name: Clean build (optional)
        if: ${{ inputs.clean_build }}
        working-directory: immortalwrt-mt798x
        run: |
          make clean

      - name: Download sources
        working-directory: immortalwrt-mt798x
        run: |
          make download -j8

      - name: Build firmware
        working-directory: immortalwrt-mt798x
        env:
          CCACHE_DIR: /home/runner/.ccache
        run: |
          echo "Using source commit: $SOURCE_COMMIT"
          make -j"$(nproc)" || make -j1 V=s

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp -av immortalwrt-mt798x/bin/targets/mediatek/* out/ || true
          ls -R out || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-360t7-${{ env.SOURCE_COMMIT }}
          path: out
          retention-days: 7